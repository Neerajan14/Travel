<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="CSS/destinations.css">
</head>

<body>

    <div id="navbar"></div>

    <!-- Hero -->
    <section class="hero-section">

        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1 class="display-3 fw-semibold">Destinations</h1>

            <p>
                <a href="index.html">Home</a>
                <span>•</span>
                Destinations
            </p>
        </div>

    </section>

    <!-- Popular Country -->
    <section class="country-section">

        <div class="container">

            <h3 class="fw-bold mb-4">
                Popular Country
            </h3>

            <div class="country-list">

                <button class="btn btn-primary rounded-pill px-4">
                    <img src="Image/Frame1.svg">
                    Nepal
                </button>

                <button class="btn btn-outline-secondary rounded-pill px-4">
                    <img src="Image/Frame.svg">
                    India
                </button>

                <button class="btn btn-outline-secondary rounded-pill px-4">
                    <img src="Image/Frame.svg">
                    France
                </button>

                <button class="btn btn-outline-secondary rounded-pill px-4">
                    <img src="Image/Frame.svg">
                    Spain
                </button>

                <button class="btn btn-outline-secondary rounded-pill px-4">
                    <img src="Image/Frame.svg">
                    Indonesia
                </button>

                <button class="btn btn-outline-secondary rounded-pill px-4">
                    <img src="Image/Frame.svg">
                    Thailand
                </button>

                <button class="btn btn-outline-secondary rounded-pill px-4">
                    <img src="Image/Frame.svg">
                    Vietnam
                </button>

                <button class="btn btn-outline-secondary rounded-pill px-4">
                    <img src="Image/Frame.svg">
                    Japan
                </button>

                <button class="btn btn-outline-secondary rounded-pill px-4">
                    <img src="Image/Frame.svg">
                    China
                </button>

                <button class="btn btn-outline-secondary rounded-pill px-4">
                    <img src="Image/Frame.svg">
                    Portugal
                </button>

            </div>

        </div>

    </section>

    <!-- Destination Cards -->
    <section class="container py-5">

        <div class="row g-4">

            <div class="col-lg-3 col-md-6">

                <div class="card destination-card">

                    <div class="position-relative">

                        <img src="Image/sarangkot.jpg" class="card-img-top destination-img">

                        <button class="wishlist-btn">

                            <img src="Image/heart.svg">

                        </button>

                    </div>

                    <div class="card-body">

                        <small class="location">

                            <img src="Image/location.svg">

                            Pokhara, Nepal

                        </small>

                        <h6 class="fw-bold mt-2">

                            Sarangkot Sunrise & Paragliding Adventure

                        </h6>

                        <div class="rating">

                            ⭐⭐⭐⭐⭐

                            <span>(243)</span>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <small>

                                <img src="Image/clock3.svg">

                                3 Days

                            </small>

                            <small>

                                From

                                <strong>$220</strong>

                            </small>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Booking Banner -->

    <section class="booking-banner">

        <img src="Image/booking.jpg">

        <div class="booking-content">

            <div class="container">

                <div class="row align-items-center">

                    <div class="col-md-6">

                        <h1>

                            Book Your <br>

                            Adventure Now

                        </h1>

                    </div>

                    <div class="col-md-6 text-md-end">

                        <a href="#" class="btn btn-primary">

                            Book Now

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <div id="footer"></div>

    <script>
        fetch("nav.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
        });

        fetch("footer.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("footer").innerHTML = data;
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
