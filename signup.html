<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seven Peak Expedition Login</title>
    <link rel="stylesheet" href="CSS/signup.css">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="container">
        <diV class="login-box">
            <div class="logo">
           <img src="Image/Seven-Peak-Logo-Menu-Bar.png" alt="Travel Logo">
              </div>

            <h2>Welcome back</h2>

            <p class="subtitle">
                Login in to explore exculusive travel deals, manage your trips,
                and enjoy a smooth, personalized booking experience.
            </p>


            <form id="loginForm">
    <label>E-mail</label>
    <input id="email" type="email" placeholder="Please type your e-mail" required>

    <div class="password-title">
        <label>Password</label>
    </div>

    <input id="password" type="password" placeholder="Please type your password" required>

    <div class="forgot-row">
        <a href="#">Forgot password?</a>
    </div>

    <button type="submit">Login</button>

    <div class="divider">
        <span></span>
        <p>or</p>
        <span></span>
    </div>

    <button type="button" class="google-btn" id="googleLogin">
        <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="">
        Sign In with Google
    </button>
</form>

     
            
        </diV>
    </div>



 <script src="Script/signup.js">

</script>
    
</body>
</html>
