<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Menu</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">

    <div class="menu-header">
        <h2>Main Menu</h2>

        <button class="close-btn">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <ul class="menu-list">

        <li class="active">
            <a href="#">
                <span>Home</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </li>

        <li>
            <a href="#">
                <span>Destination</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </li>

        <li>
            <a href="#">
                <span>About</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </li>

        <li>
            <a href="#">
                <span>Blog</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </li>

        <li>
            <a href="#">
                <span>Faq</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </li>

        <li class="no-border">
            <a href="#">
                <span>Contact</span>
            </a>
        </li>

    </ul>

    <div class="social">

        <a href="#"><i class="fab fa-facebook-f"></i></a>

        <a href="#"><i class="fab fa-twitter"></i></a>

        <a href="#"><i class="fab fa-instagram"></i></a>

        <a href="#"><i class="fab fa-linkedin-in"></i></a>

    </div>

</div>

</body>
</html>

<style>


    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
}

.sidebar{
    width:400px;
    min-height:100vh;
    background:#fff;
    padding:40px;
}

.menu-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:40px;
}

.menu-header h2{
    font-size:38px;
    color:#111827;
}

.close-btn{
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:#f3f4f6;
    cursor:pointer;
    font-size:18px;
    color:#6b7280;
}

.menu-list{
    list-style:none;
}

.menu-list li{
    border-bottom:1px solid #e5e7eb;
}

.menu-list li.no-border{
    border-bottom:none;
}

.menu-list a{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 0;
    text-decoration:none;
    color:#1f2937;
    font-size:18px;
    font-weight:500;
    transition:.3s;
}

.menu-list a:hover{
    color:#2563eb;
}

.menu-list .active a{
    color:#2563eb;
}

.menu-list i{
    font-size:16px;
}

.social{
    display:flex;
    gap:18px;
    margin-top:60px;
}

.social a{
    color:#1f2a60;
    font-size:22px;
    transition:.3s;
}

.social a:hover{
    color:#2563eb;
}


</style>
