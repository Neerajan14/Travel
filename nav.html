<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="CSS/nav.css">

    <title>Travel Navbar</title>
</head>
<body>

<nav class="navbar">

    <a href="index.html" class="logo">
        <img src="Image/Seven-Peak-Logo-transparent.png" alt="Seven Peak Logo">
    </a>

  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input
        type="search"
        name="destination-search"
        placeholder="Search destinations or activities"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false">
     </div>

    <div class="nav-links">
        <a href="signup.html">Sign up</a>


        <button class="menu-btn" id="menuBtn">
    <img src="Icons/hamburger menu.svg" alt="Menu">
</button>

   
    </div>

</nav>

<!-- Overlay -->
<div class="menu-overlay" id="menuOverlay"></div>

<!-- Side Menu -->
<aside class="side-menu" id="sideMenu">
    <div class="side-menu-header">
        <h3>Main Menu</h3>
        <button class="close-menu" id="closeMenu">&times;</button>
    </div>

    <nav class="side-menu-links">
        <a href="index.html">Home <span>&rsaquo;</span></a>
        <a href="destinations.html">Destination <span>&rsaquo;</span></a>
        <a href="about.html">About <span>&rsaquo;</span></a>
        <a href="blog.html">Blog <span>&rsaquo;</span></a>
        <a href="faq.html">FAQ <span>&rsaquo;</span></a>
        <a href="contact.html" class="contact-link">Contact</a>
    </nav>

    <div class="side-menu-social">
        <a href="#"><img src="Icons/facebook.svg" alt="Facebook"></a>
        <a href="#"><img src="Icons/instagram.svg" alt="Instagram"></a>
    </div>
</aside>




<script>
    const sortToggle = document.getElementById('sortToggle');
    const sortMenu = document.getElementById('sortMenu');
    const sortLabel = document.getElementById('sortLabel');
    const sortOptions = document.querySelectorAll('.sort-option');

    sortToggle.addEventListener('click', () => {
        sortMenu.classList.toggle('show');
    });

    sortOptions.forEach(option => {
        option.addEventListener('click', () => {
            sortOptions.forEach(o => o.classList.remove('active'));
            option.classList.add('active');
            sortLabel.textContent = option.dataset.value;
            sortMenu.classList.remove('show');
        });
    });

    document.addEventListener('click', (e) => {
        if (!document.getElementById('customSort').contains(e.target)) {
            sortMenu.classList.remove('show');
        }
    });


      document.addEventListener("DOMContentLoaded", function () {
    const cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        card.addEventListener("click", function (e) {
          
            if (e.target.closest(".heart")) {
                return;
            }
            window.location.href = this.dataset.href;
        });
    });
});
</script>






</body>
</html>
