<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>

    <link rel="stylesheet" href="CSS/gallery.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>



    <!-- Navbar -->
    <div id="navbar"></div>

<section class="gallery-section">

    <div class="title">
        <h1>Gallery</h1>
        <p>Explore our Photos & Videos Collection</p>
    </div>

    <!-- PHOTO -->
    <div class="section-heading">
        <h2><i class="fa-solid fa-image"></i> Photo Gallery</h2>
        <a href="photo-gallery.html">View All →</a>
    </div>

    <div class="gallery-grid">

        <img src="https://picsum.photos/500/350?1" class="gallery-img">

        <img src="https://picsum.photos/500/350?2" class="gallery-img">

        <img src="https://picsum.photos/500/350?3" class="gallery-img">

        <img src="https://picsum.photos/500/350?4" class="gallery-img">



    </div>

    <hr>

    <!-- VIDEO -->

    <div class="section-heading">

        <h2><i class="fa-brands fa-youtube"></i> Video Gallery</h2>

        <a href="video-gallery.html">View All →</a>

    </div>

    <div class="gallery-grid">

        <div class="video-card" data-video="ScMzIvxBSi4">
            <img src="https://img.youtube.com/vi/ScMzIvxBSi4/hqdefault.jpg">
            <div class="play-btn">
                <i class="fa-solid fa-play"></i>
            </div>
        </div>

        <div class="video-card" data-video="ysz5S6PUM-U">
            <img src="https://img.youtube.com/vi/ysz5S6PUM-U/hqdefault.jpg">
            <div class="play-btn">
                <i class="fa-solid fa-play"></i>
            </div>
        </div>

        <div class="video-card" data-video="aqz-KE-bpKQ">
            <img src="https://img.youtube.com/vi/aqz-KE-bpKQ/hqdefault.jpg">
            <div class="play-btn">
                <i class="fa-solid fa-play"></i>
            </div>
        </div>


           <div class="video-card" data-video="aqz-KE-bpKQ">
            <img src="https://img.youtube.com/vi/aqz-KE-bpKQ/hqdefault.jpg">
            <div class="play-btn">
                <i class="fa-solid fa-play"></i>
            </div>
        </div>

    </div>

</section>


<!-- IMAGE MODAL -->

<div class="modal" id="imageModal">

    <span class="close">&times;</span>

    <img id="modalImage">

</div>


<!-- VIDEO MODAL -->

<div class="modal" id="videoModal">

    <span class="close-video">&times;</span>

    <iframe id="youtubePlayer"
        allowfullscreen
        frameborder="0">
    </iframe>

</div>

<!-- Footer -->
<div id="footer"></div>


<script src="Script/gallery.js"></script>

</body>
</html>
